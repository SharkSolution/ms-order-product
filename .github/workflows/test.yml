# CI mínima: corre la suite de tests en cada push y cada pull request.
#
# POR QUÉ EXISTE: hasta ahora este repositorio tenía 236 métodos @Test y ningún
# workflow. Los tests solo corrían si alguien se acordaba de correrlos a mano, y
# eso convierte cualquier refactor en una apuesta. El objetivo de este archivo no
# es cobertura ni calidad: es que un test que se rompe se vea antes del merge.
#
# JDK 17 no es un supuesto: sale de build.gradle:10
#   java { toolchain { languageVersion = JavaLanguageVersion.of(17) } }
#
# DOCKER: la suite usa Testcontainers (build.gradle:43-45) para levantar un
# Postgres real — CloudTenantIsolationTest se conecta como `app_user` para
# comprobar que RLS aísla de verdad. Los runners `ubuntu-latest` de GitHub traen
# Docker, así que no hace falta configurar nada; en un runner propio sí haría
# falta.

name: test

on:
  push:
  pull_request:

# Un push nuevo sobre la misma rama cancela la corrida anterior: no tiene
# sentido gastar minutos en un commit que ya quedó atrás.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ./gradlew test (JDK 17)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Preparar Gradle (con caché)
        uses: gradle/actions/setup-gradle@v4

      # `test` ya falla el paso si algún test falla (Gradle devuelve código != 0),
      # que es lo que hace fallar el workflow. `--no-daemon` porque el runner es
      # efímero y el demonio no aporta nada.
      - name: Correr los tests
        run: ./gradlew test --no-daemon

      # Se publica SIEMPRE, también cuando los tests fallan: el informe de la
      # corrida roja es justamente el que hace falta leer.
      - name: Publicar el informe de tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: informe-tests
          path: |
            build/reports/tests/test
            build/test-results/test
          retention-days: 14

      # Resumen legible en la pestaña Summary del workflow, para no tener que
      # descargar el artefacto solo para saber cuántos pasaron.
      - name: Resumen de resultados
        if: always()
        run: |
          if [ ! -d build/test-results/test ]; then
            echo "No se generaron resultados de tests." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          total=$(grep -ho 'tests="[0-9]*"' build/test-results/test/*.xml \
                  | grep -o '[0-9]*' | awk '{s+=$1} END{print s+0}')
          fallos=$(grep -ho 'failures="[0-9]*"' build/test-results/test/*.xml \
                  | grep -o '[0-9]*' | awk '{s+=$1} END{print s+0}')
          errores=$(grep -ho 'errors="[0-9]*"' build/test-results/test/*.xml \
                  | grep -o '[0-9]*' | awk '{s+=$1} END{print s+0}')
          omitidos=$(grep -ho 'skipped="[0-9]*"' build/test-results/test/*.xml \
                  | grep -o '[0-9]*' | awk '{s+=$1} END{print s+0}')
          {
            echo "## Resultado de los tests"
            echo ""
            echo "| | |"
            echo "|---|---:|"
            echo "| Ejecutados | $total |"
            echo "| Fallidos | $fallos |"
            echo "| Con error | $errores |"
            echo "| Omitidos | $omitidos |"
          } >> "$GITHUB_STEP_SUMMARY"
