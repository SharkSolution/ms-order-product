server:
  port: 8081
spring:
  datasource:
    driver-class-name: org.sqlite.JDBC
    url: jdbc:sqlite:./data/ms_order_product.db
    hikari:
      maximum-pool-size: 1
      minimum-idle: 1
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.community.dialect.SQLiteDialect
        format_sql: true
        use_sql_comments: true
