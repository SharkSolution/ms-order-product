server:
  port: 8081
spring:
  # Multi-tenancy (B1): las migraciones Flyway son SOLO para el esquema Postgres
  # cloud. Se desactiva el auto-run para NO ejecutarlas contra el SQLite local.
  flyway:
    enabled: false
  datasource:
    driver-class-name: org.sqlite.JDBC
    url: jdbc:sqlite:./data/ms_order_product.db
    hikari:
      maximum-pool-size: 1
      minimum-idle: 1
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.community.dialect.SQLiteDialect
        format_sql: true
        use_sql_comments: true
    hibernate:
      ddl-auto: update
    show-sql: false
logging:
  level:
    com.suresell.order.serivices: INFO
  application:
    name: ms-order-product
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
coupon:
  admin:
    password: Admin2025*
sync:
  scheduler:
    fixed-delay-ms: 5000
    batch-size: 20
  cloud:
    enabled: true
    datasource:
