server:
  port: 8081
spring:
  datasource:
    driver-class-name: org.sqlite.JDBC
    url: jdbc:sqlite:./data/ms_order_product.db
    hikari:
      maximum-pool-size: 1
      minimum-idle: 1
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.community.dialect.SQLiteDialect
        format_sql: true
        use_sql_comments: true
    hibernate:
      ddl-auto: update
    show-sql: false
logging:
  level:
    com.suresell.order.serivices: INFO
  application:
    name: ms-order-product
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
coupon:
  admin:
    password: Admin2025*
sync:
  scheduler:
    fixed-delay-ms: 5000
    batch-size: 20
  cloud:
    enabled: true
    datasource:
      driver-class-name: org.postgresql.Driver
      # prepareThreshold=0: el pooler de Supabase (6543, modo transacción / PgBouncer) NO soporta
      # server-side prepared statements; sin esto el driver crea statements con nombre (S_1, S_17...)
      # que colisionan al reutilizar conexiones del pool -> "prepared statement already exists" ->
      # la transacción se aborta y las órdenes de caja no se sincronizan a la nube (no llegan a cocina).
      url: jdbc:postgresql://aws-1-us-east-1.pooler.supabase.com:6543/postgres?prepareThreshold=0
      username: postgres.iwlbtkqszbkugfxdpzyk
      password: w9Rz3wcIeT3i184t
      hikari:
        maximum-pool-size: 4
        minimum-idle: 1
        idle-timeout: 30000
        max-lifetime: 1800000
